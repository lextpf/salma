name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

    steps:
      - uses: actions/checkout@v4

      # salma_tests loads the Rust engine at runtime, and CMake stages the DLL only when
      # target/package/mo2-salma.dll exists at configure time. build and stage it first.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build the Rust engine
        run: cargo build --release

      - name: Stage the engine DLL
        run: python scripts/package.py --no-build

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "05442024c3fda64320bd25d2251cc9807b84fb6f"

      - name: Configure CMake
        run: cmake --preset ci-release

      - name: Build tests
        run: cmake --build --preset ci-tests

      - name: Run tests
        run: ctest --preset ci
