name: build

# The Rust engine is the build. The C++ engine is retained only as the parity
# oracle and is gated by test.yml; it is no longer built here.
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/**"
      - "web/**"
      - "build.bat"
      - "test.bat"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/**"
      - "web/**"
      - "build.bat"
      - "test.bat"
      - ".github/workflows/build.yml"

jobs:
  engine:
    name: engine (rust)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --release -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Test (release)
        run: cargo test --release

      # The three checks below are self-contained, so they run on a clean
      # runner. `scripts/run_harness.py` is not among them: it drives the
      # round-trip harness against a live MO2 install, which does not exist here.
      - name: Package the deployable DLL
        run: python scripts/package.py --no-build

      - name: Smoke test the C ABI
        run: python scripts/smoke_ctypes.py target/release/mo2_salma_rs.dll

      - name: Smoke test the MO2 plugin loader
        run: python scripts/smoke_plugin.py

      - name: Upload the deployable DLL
        uses: actions/upload-artifact@v4
        with:
          name: mo2-salma-dll
          path: target/package/mo2-salma.dll
          if-no-files-found: error

  web:
    name: web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm run build` is tsc (type-check) THEN vite build, so this is the
      # frontend's type gate as well as its build. Kept out of the engine job
      # because the SPA is served by the C++ mo2-server, which the Rust port
      # does not replace.
      - name: Build
        run: |
          npm ci
          npm run build
