name: eslint

# Scoped to web/: the only ESLint-covered code in the repo. Without the path
# filter this ran on every push to main, including C++ and Rust-only changes.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/eslint.yaml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/eslint.yaml"

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'                 # match build.yml's web build
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint                     # eslint . --max-warnings 0
