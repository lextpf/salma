#   ============================================================================================  *
# 
#       The salma engine: a wizardless FOMOD installer and selection-inference
#       engine. It reads an archive's ModuleConfig.xml, infers which options an
#       already-installed mod was built from, and replays the install itself.
#       Archive handling, XML parsing, constraint solving and file placement all
#       live here, behind the one flat extern "C" ABI in src/capi.rs that the MO2
#       plugin and mo2-server both drive.
# 
#     ----------------------------------------------------------------------
# 
#       Repository:   https://github.com/lextpf/salma
#       License:      GPL
# 

[package]
name = "mo2_salma_rs"
# the ABI constant in src/capi.rs owns the shipped version and package name.
version = "0.1.0"
edition = "2024"
# Rust 1.85 is the first stable toolchain for edition 2024.
rust-version = "1.85"
description = "salma MO2 FOMOD engine with a C ABI for the server and plugin."
publish = false

[lib]
name = "mo2_salma_rs"
# `cdylib` ships the engine. `rlib` lets tests link it.
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
# module paths and local timestamps use these Win32 APIs.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }

[dependencies]
roxmltree = "0.21"
serde_json = "1.0"
# unrar compiles the proprietary unRAR sources.
zip = "8.6.0"
sevenz-rust2 = "0.21.3"
unrar = "0.5.8"

[lints.rustdoc]
broken_intra_doc_links = "deny"
redundant_explicit_links = "deny"
private_intra_doc_links = "allow"
