# The salma engine.
#
# This crate lives at the repo root and shares src/ and tests/ with the C++ that
# remains (the Crow server behind the web dashboard). The two never collide:
# cargo only looks at *.rs, and CMake takes an explicit file list. The port is
# file-for-file, so src/FomodService.cpp and src/fomod_service.rs sit adjacent.
#
# Builds to target/, never the C++ build/bin/ tree. Produces mo2_salma_rs.dll;
# tools/package.py renames it to mo2-salma.dll at cutover (see CUTOVER.md).
[package]
name = "mo2_salma_rs"
version = "0.1.0"
edition = "2024"
# Floor is the first stable toolchain that supports edition 2024.
rust-version = "1.85"
description = "Rust port of the salma mo2-core FOMOD engine, exposing the flat C ABI as mo2_salma_rs.dll."
publish = false

[lib]
name = "mo2_salma_rs"
# cdylib -> the mo2_salma_rs.dll the MO2 plugin loads via ctypes.
# rlib   -> lets `cargo test` link the boundary helpers as a normal library.
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
# Minimal Win32 surface for utils::module_directory / executable_directory
# (GetModuleHandleExW + GetModuleFileNameW), mirroring src/Utils.cpp, plus
# GetLocalTime for logger timestamps: the C++ formats with localtime_s, and
# std has no local-time conversion, so the same OS call keeps the log lines
# byte-identical including the DST/timezone rules.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }

[dependencies]
roxmltree = "0.21"
# Archive backends (Task 11). Pure-Rust zip + 7z; unrar links the proprietary
# unRAR C sources (read-only decompress; see PARITY-NOTES "Task 11" for the
# license note and the build.rs Win32 link requirement).
zip = "8.6.0"
sevenz-rust2 = "0.21.3"
unrar = "0.5.8"

# [profile.release] intentionally left at cargo defaults.
