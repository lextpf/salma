# @brief build the generated C++ API site.
# @author Alex (https://github.com/lextpf)
#

site_name: salma documentation
use_directory_urls: false

# keep non-API working documents out of the generated site.
exclude_docs: |
  superpowers/

validation:
  links:
    not_found: info
site_description: wizardless FOMOD installer and selection-inference engine
site_author: lextpf

theme:
  name: material
  custom_dir: docs
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.sections

    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# before adding formulas, load a local MathJax config ahead of this CDN entry. set
# `options.processHtmlClass` to `arithmatex` and `options.ignoreHtmlClass` to `.*` so MathJax does
# not process ordinary page text.
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home:
    - index.md
  - C++ API Reference:
    - Core:
      - Core/index.md
      - Logger: Core/Logger/index.md
      - Utils: Core/Utils/index.md
      - SecurityContext: Core/SecurityContext/index.md
    - Server:
      - Server/index.md
      - InstallationController: Server/InstallationController/index.md
      - MultipartHandler: Server/MultipartHandler/index.md
      - StaticFileHandler: Server/StaticFileHandler/index.md
      - ConfigService: Server/ConfigService/index.md
      - Mo2Controller: Server/Mo2Controller/index.md
      - SecurityMiddleware: Server/SecurityMiddleware/index.md
      - Mo2Helpers: Server/Mo2Helpers/index.md
    # only mo2core has an ungrouped namespace page.
    - Namespaces:
      - mo2core: mo2core/index.md
