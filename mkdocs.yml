site_name: salma Documentation
use_directory_urls: false

# docs/ is doxide's output directory, but it also collects working documents that
# are not part of the published API reference. Everything matched here stays out
# of site/. Patterns are gitignore-style and need mkdocs 1.6 or later.
exclude_docs: |
  superpowers/

validation:
  links:
    not_found: info
site_description: Wizardless FOMOD installer, processor, and selection-inference engine
site_author: lextpf

theme:
  name: material
  custom_dir: docs
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.sections

    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# MathJax renders the `$...$` and `$$...$$` spans that pymdownx.arithmatex emits
# in `generic: true` mode. No page uses math yet.
#
# Before adding the first formula, add a local config file ahead of this CDN
# entry that sets `tex.inlineMath`/`tex.displayMath` and, most importantly,
# `options.processHtmlClass: "arithmatex"` with `options.ignoreHtmlClass: ".*"`.
# Without it MathJax typesets the WHOLE page, so a stray dollar sign or a
# backslash-bracket pair in prose or in an inline code span is swallowed.
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home:
    - index.md
  - C++ API Reference:
    - Core:
      - Core/index.md
      - Logger: Core/Logger/index.md
      - Utils: Core/Utils/index.md
      - SecurityContext: Core/SecurityContext/index.md
    - Server:
      - Server/index.md
      - InstallationController: Server/InstallationController/index.md
      - MultipartHandler: Server/MultipartHandler/index.md
      - StaticFileHandler: Server/StaticFileHandler/index.md
      - ConfigService: Server/ConfigService/index.md
      - Mo2Controller: Server/Mo2Controller/index.md
      - SecurityMiddleware: Server/SecurityMiddleware/index.md
      - Mo2Helpers: Server/Mo2Helpers/index.md
    # Namespace page. doxide emits one per namespace that carries a
    # namespace-level doc block, plus a member table for any symbol with no
    # @ingroup. Only mo2core has such a block (Types.hpp), and its member table
    # is now empty because every type is tagged into Core individually, which is
    # what doxide requires: it refuses @ingroup on a namespace itself.
    # mo2server has no entry here on purpose - every mo2server symbol is grouped,
    # so doxide generates no fallback page and a nav entry would dangle.
    - Namespaces:
      - mo2core: mo2core/index.md
