sonar.projectKey=lextpf_salma
sonar.organization=lextpf

# Both engines are analyzed: src/ is the C++ oracle, rust/src is the port.
sonar.sources=src,rust/src
sonar.tests=tests,rust/tests
sonar.sourceEncoding=UTF-8

# C/C++ analysis via Build Wrapper
sonar.cfamily.build-wrapper-output=bw-output

# Rust analysis. The analyzer runs Clippy itself (sonar.rust.clippy.enabled
# defaults to true) and needs cargo + the clippy component on the runner;
# sonar.yml installs them. It looks for Cargo.toml in the PROJECT ROOT by
# default, and ours is one level down, so the manifest path is explicit.
sonar.rust.cargo.manifestPaths=rust/Cargo.toml

# The golden-case corpus is committed test DATA (XML + JSON fixtures), not code.
sonar.exclusions=rust/tests/golden/**

# Skip coverage analysis (no coverage data collected)
sonar.coverage.exclusions=**/*
