sonar.projectKey=lextpf_salma
sonar.organization=lextpf

# Both languages live in src/ and tests/ now, so one entry covers each.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# C/C++ analysis via Build Wrapper
sonar.cfamily.build-wrapper-output=bw-output

# Rust analysis. The analyzer runs Clippy itself (sonar.rust.clippy.enabled
# defaults to true) and needs cargo + the clippy component on the runner;
# sonar.yml installs them. The manifest path is the analyzer's own default now
# that Cargo.toml is at the project root, but it is stated explicitly so a
# future move does not silently drop Rust from the scan.
sonar.rust.cargo.manifestPaths=Cargo.toml

# The golden-case corpus is committed test DATA (XML + JSON fixtures), not code.
sonar.exclusions=tests/golden/**

# Skip coverage analysis (no coverage data collected)
sonar.coverage.exclusions=**/*
