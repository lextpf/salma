# @brief analyze the Rust engine and C++ server.
# @author Alex (https://github.com/lextpf)
#

sonar.projectKey=lextpf_salma
sonar.organization=lextpf

# both languages share the source and test directories.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# C++ analysis uses Build Wrapper output.
sonar.cfamily.build-wrapper-output=bw-output

# the Rust analyzer invokes Cargo and Clippy.
sonar.rust.cargo.manifestPaths=Cargo.toml

# coverage data is not collected.
sonar.coverage.exclusions=**/*
