# @brief configure C++ API generation for the server and support library.
# @author Alex (https://github.com/lextpf)
#

title: salma
description: the Crow server and support library behind the salma dashboard

# each group needs a matching `@ingroup` entry in a C++ header.
output: docs

defines:
  MO2_API: ""

files:
  - "src/*.hpp"
  - "src/*.cpp"

groups:
  - name: Core
    title: ":material-cube: Core"
    description: logging and shared support types linked into the server.
    groups:
      - name: Logger
        title: Logger
        description: thread-safe logging with external callback support.
      - name: Utils
        title: Utils
        description: string, path, hash, and path-safety helpers.
      - name: SecurityContext
        title: SecurityContext
        description: per-process CSRF token and Origin allowlist.

  - name: Server
    title: ":material-server: Server"
    description: Crow server, REST controllers, and static file serving.
    groups:
      - name: InstallationController
        title: InstallationController
        description: upload, install, and status endpoints.
      - name: MultipartHandler
        title: MultipartHandler
        description: multipart form-data parsing and file storage.
      - name: StaticFileHandler
        title: StaticFileHandler
        description: static file serving for the React SPA.
      - name: ConfigService
        title: ConfigService
        description: settings stored in salma.json.
      - name: Mo2Controller
        title: Mo2Controller
        description: MO2 dashboard endpoints.
      - name: SecurityMiddleware
        title: SecurityMiddleware
        description: Origin and CSRF enforcement for Crow.
      - name: Mo2Helpers
        title: Mo2Helpers
        description: response, decoding, and path helpers for MO2 controllers.
